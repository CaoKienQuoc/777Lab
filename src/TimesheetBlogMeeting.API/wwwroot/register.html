<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký — 777LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="kicker">Hệ thống nội bộ</div>
        <h1>777<span style="color:var(--accent)">LAB</span></h1>
        <p>Tạo tài khoản mới</p>
      </div>

      <form id="register-form">
        <div class="field">
          <label for="fullName">Họ và tên</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="Nhập họ và tên" required />
        </div>
        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Ít nhất 3 ký tự" required />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" required />
        </div>
        <div class="field">
          <label for="confirm">Nhập lại mật khẩu</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="register-btn">
          Tạo tài khoản
        </button>
      </form>

      <p class="login-alt">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
