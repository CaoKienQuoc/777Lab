<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title="register">Đăng ký — 777LAB</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=12" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img class="login-logo" src="/img/logo_login.png" alt="777LAB" />
        <p data-i18n="createAccount">Tạo tài khoản mới</p>
      </div>

      <form id="register-form">
        <div class="field">
          <label for="fullName" data-i18n="fullName">Họ và tên</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" data-i18n-placeholder="fullNamePlaceholder" required />
        </div>
        <div class="field">
          <label for="email" data-i18n="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" data-i18n-placeholder="emailPlaceholder" required />
        </div>
        <div class="field">
          <label for="username" data-i18n="username">Tên đăng nhập</label>
          <input type="text" id="username" name="username" autocomplete="username" data-i18n-placeholder="usernameShortHint" required />
        </div>
        <div class="field">
          <label for="password" data-i18n="password">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="new-password" data-i18n-placeholder="passwordLongHint" required />
        </div>
        <div class="field">
          <label for="confirm" data-i18n="confirmPassword">Nhập lại mật khẩu</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" data-i18n-placeholder="confirmPasswordPlaceholder" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="register-btn" data-i18n="registerBtn">
          Tạo tài khoản
        </button>
      </form>

      <p class="login-alt">
        <span data-i18n="hasAccount">Đã có tài khoản?</span>
        <a href="/login.html" data-i18n="login">Đăng nhập</a>
      </p>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
  <script>
    (function() {
      const LANG = localStorage.getItem('lang') || 'vi';
      const LANG_KEYS = {
        vi: {
          internalSystem: 'Hệ thống nội bộ', createAccount: 'Tạo tài khoản mới',
          email: 'Email', emailPlaceholder: 'Nhập địa chỉ email',
          fullName: 'Họ và tên', username: 'Tên đăng nhập', password: 'Mật khẩu', confirmPassword: 'Nhập lại mật khẩu',
          fullNamePlaceholder: 'Nhập họ và tên', usernameShortHint: 'Ít nhất 3 ký tự',
          passwordLongHint: 'Ít nhất 6 ký tự', confirmPasswordPlaceholder: 'Nhập lại mật khẩu',
          registerBtn: 'Tạo tài khoản', hasAccount: 'Đã có tài khoản?', login: 'Đăng nhập'
        },
        ja: {
          internalSystem: '社内システム', createAccount: 'アカウント作成',
          email: 'メールアドレス', emailPlaceholder: 'メールアドレスを入力',
          fullName: '氏名', username: 'ユーザー名', password: 'パスワード', confirmPassword: 'パスワード再入力',
          fullNamePlaceholder: '氏名を入力', usernameShortHint: '最小3文字',
          passwordLongHint: '最小6文字', confirmPasswordPlaceholder: 'パスワードを再入力してください',
          registerBtn: 'アカウント作成', hasAccount: 'すでにアカウントをお持ちですか？', login: 'ログイン'
        }
      };
      const t = (key) => (LANG_KEYS[LANG] && LANG_KEYS[LANG][key]) || key;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (LANG_KEYS[LANG] && LANG_KEYS[LANG][key]) el.textContent = LANG_KEYS[LANG][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (LANG_KEYS[LANG] && LANG_KEYS[LANG][key]) el.placeholder = LANG_KEYS[LANG][key];
      });
      const titleEl = document.querySelector('[data-i18n-title]');
      if (titleEl && LANG_KEYS[LANG]) {
        const key = titleEl.getAttribute('data-i18n-title');
        if (LANG_KEYS[LANG][key]) titleEl.textContent = LANG_KEYS[LANG][key];
      }
    })();
  </script>
</body>
</html>
