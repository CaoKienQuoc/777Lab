<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — 777LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="kicker">Hệ thống nội bộ</div>
        <h1>777<span style="color:var(--accent)">LAB</span></h1>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="login-btn">
          Đăng nhập
        </button>
      </form>

      <div class="login-divider" id="login-divider"><span>hoặc</span></div>

      <div id="google-btn" class="google-btn-wrap"></div>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
  <script src="https://accounts.google.com/gsi/client" onload="onGoogleLoad()" async defer></script>
</body>
</html>
